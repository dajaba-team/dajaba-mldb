[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dajaba-assemble-db"
version = "0.3.1"
description = "Independent source assembly with exact three-format verification"
requires-python = ">=3.11"
dependencies = ["dajaba-dbcheck>=0.2.0"]

[project.scripts]
assemble-db = "assemble_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
